<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSEM LLP</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #0b1220;
      color: #fff;
    }
    .card {
      width: min(680px, 90%);
      padding: 56px 42px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 24px;
      background: rgba(255,255,255,.06);
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }
    h1 { margin: 0 0 12px; font-size: clamp(42px, 8vw, 72px); letter-spacing: 4px; }
    p { margin: 0; font-size: 20px; color: #cbd5e1; }
    .status { margin-top: 28px; font-size: 14px; color: #86efac; }
  </style>
</head>
<body>
  <main class="card">
    <h1>SSEM</h1>
    <p>SSEM LLP</p>
    <div class="status">GitHub Pages test page is live.</div>
  </main>
</body>
</html>
